<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Model domeny kontekstu uwierzytelniania bankowego</title>
  <desc id="desc">Diagram pokazuje dwa agregaty: tożsamość klienta oraz sesję uwierzytelniającą, ich encje, obiekty wartości i integrację z zarządzaniem kontem.</desc>
  <defs>
    <style>
      .context { fill: #f7f9fc; stroke: #243b53; stroke-width: 3; }
      .aggregate { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .entity { fill: #fff; stroke: #334e68; stroke-width: 2; }
      .value { fill: #fff8e1; stroke: #b7791f; stroke-width: 2; }
      .external { fill: #edf2f7; stroke: #52606d; stroke-width: 2; stroke-dasharray: 8 5; }
      .title { font: 700 24px sans-serif; fill: #102a43; }
      .heading { font: 700 17px sans-serif; fill: #102a43; }
      .label { font: 14px sans-serif; fill: #243b53; }
      .small { font: 12px sans-serif; fill: #486581; }
      .line { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/>
    </marker>
  </defs>

  <rect class="context" x="30" y="25" width="1140" height="710" rx="18"/>
  <text class="title" x="600" y="65" text-anchor="middle">Bounded Context: Uwierzytelnianie</text>

  <rect class="aggregate" x="65" y="105" width="510" height="500" rx="14"/>
  <text class="heading" x="320" y="140" text-anchor="middle">Agregat: Tożsamość klienta</text>
  <text class="small" x="320" y="162" text-anchor="middle">korzeń: Klient</text>

  <rect class="entity" x="95" y="190" width="210" height="90" rx="8"/>
  <text class="heading" x="200" y="218" text-anchor="middle">Klient</text>
  <text class="label" x="110" y="244">status blokady</text>
  <text class="label" x="110" y="264">licznik prób logowania</text>

  <rect class="entity" x="335" y="190" width="210" height="90" rx="8"/>
  <text class="heading" x="440" y="218" text-anchor="middle">Poświadczenie</text>
  <text class="label" x="350" y="244">hash hasła</text>
  <text class="label" x="350" y="264">data zmiany</text>

  <rect class="entity" x="95" y="330" width="210" height="90" rx="8"/>
  <text class="heading" x="200" y="358" text-anchor="middle">Urządzenie zaufane</text>
  <text class="label" x="110" y="384">data wygaśnięcia</text>
  <text class="label" x="110" y="404">status unieważnienia</text>

  <rect class="value" x="335" y="330" width="210" height="90" rx="8"/>
  <text class="heading" x="440" y="358" text-anchor="middle">LoginIdentifier</text>
  <text class="label" x="350" y="384">znormalizowany e-mail</text>
  <text class="label" x="350" y="404">maks. 254 znaki</text>

  <rect class="value" x="95" y="470" width="210" height="90" rx="8"/>
  <text class="heading" x="200" y="498" text-anchor="middle">DeviceFingerprint</text>
  <text class="label" x="110" y="524">hash danych urządzenia</text>
  <text class="label" x="110" y="544">bez sekretów wprost</text>

  <rect class="value" x="335" y="470" width="210" height="90" rx="8"/>
  <text class="heading" x="440" y="498" text-anchor="middle">PasswordHash</text>
  <text class="label" x="350" y="524">Argon2id + parametry</text>
  <text class="label" x="350" y="544">brak hasła jawnego</text>

  <rect class="aggregate" x="625" y="105" width="510" height="500" rx="14"/>
  <text class="heading" x="880" y="140" text-anchor="middle">Agregat: Sesja uwierzytelniająca</text>
  <text class="small" x="880" y="162" text-anchor="middle">korzeń: Sesja</text>

  <rect class="entity" x="655" y="205" width="210" height="100" rx="8"/>
  <text class="heading" x="760" y="233" text-anchor="middle">Sesja</text>
  <text class="label" x="670" y="259">stan i czas wygaśnięcia</text>
  <text class="label" x="670" y="279">znacznik unieważnienia</text>

  <rect class="entity" x="895" y="205" width="210" height="100" rx="8"/>
  <text class="heading" x="1000" y="233" text-anchor="middle">Wyzwanie MFA</text>
  <text class="label" x="910" y="259">typ i liczba prób</text>
  <text class="label" x="910" y="279">status wykorzystania</text>

  <rect class="value" x="655" y="370" width="210" height="100" rx="8"/>
  <text class="heading" x="760" y="398" text-anchor="middle">SessionToken</text>
  <text class="label" x="670" y="424">losowy, min. 256 bitów</text>
  <text class="label" x="670" y="444">w bazie tylko hash</text>

  <rect class="value" x="895" y="370" width="210" height="100" rx="8"/>
  <text class="heading" x="1000" y="398" text-anchor="middle">OneTimeCode</text>
  <text class="label" x="910" y="424">6 cyfr ASCII</text>
  <text class="label" x="910" y="444">ważny 5 minut</text>

  <rect class="external" x="365" y="650" width="470" height="55" rx="10"/>
  <text class="heading" x="600" y="684" text-anchor="middle">Kontekst zewnętrzny: Zarządzanie kontem</text>

  <path class="line" d="M545 235 C590 235 610 235 655 235"/>
  <text class="small" x="600" y="222" text-anchor="middle">uruchamia sesję</text>
  <path class="line" d="M865 255 L895 255"/>
  <path class="line" d="M760 305 L760 370"/>
  <path class="line" d="M1000 305 L1000 370"/>
  <path class="line dashed" d="M320 605 L450 650"/>
  <path class="line dashed" d="M880 605 L750 650"/>
  <text class="small" x="320" y="640" text-anchor="middle">wynik uwierzytelnienia</text>
  <text class="small" x="880" y="640" text-anchor="middle">autoryzacja sesji</text>
</svg>
